name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Fail if a credential reaches the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for connection strings and tokens
        shell: bash
        run: |
          set -uo pipefail
          found=0

          # Every connection string in the repository has to use the *** or an
          # empty placeholder. Anything else is a real credential. A regex on
          # the password shape would trip over the placeholder instead.
          bad=$(git grep -I -n 'mongodb+srv://' -- . | grep -vE '\*\*\*|<user|username' || true)
          if [ -n "$bad" ]; then
            echo "::error::A MongoDB connection string with a password is in the repository."
            echo "$bad"
            found=1
          fi

          for pattern in 'gh[pousr]_[A-Za-z0-9]{20,}' 'vcp_[A-Za-z0-9]{20,}' 'sk-[A-Za-z0-9]{20,}'; do
            if git grep -I -n -E "$pattern" -- . ; then
              echo "::error::A token is in the repository."
              found=1
            fi
          done

          if git ls-files --error-unmatch .env.local .env.production .env.production.tmp atlas-credentials.env 2>/dev/null; then
            echo "::error::An environment file with secrets is tracked in git."
            found=1
          fi

          exit $found
