name: dependabot auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the green dependabot PR (minor/patch only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,title --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "no open PR for $BRANCH"; exit 0
          fi
          number=$(printf '%s' "$pr" | jq -r '.number')
          title=$(printf '%s' "$pr" | jq -r '.title')
          echo "PR #$number: $title"
          if printf '%s' "$title" | grep -qiE 'bump .* from [0-9]+\.'; then
            old_major=$(printf '%s' "$title" | sed -nE 's/.* from ([0-9]+)\..*/\1/p')
            new_major=$(printf '%s' "$title" | sed -nE 's/.* to ([0-9]+)\..*/\1/p')
            if [ -n "$old_major" ] && [ -n "$new_major" ] && [ "$old_major" != "$new_major" ]; then
              echo "major bump — leaving PR open for review"; exit 0
            fi
          fi
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch
