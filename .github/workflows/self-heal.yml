name: self-heal

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the latest production deployment
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          data=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=1&target=production")
          state=$(printf '%s' "$data" | jq -r '.deployments[0].state // "UNKNOWN"')
          url=$(printf '%s' "$data" | jq -r '.deployments[0].url // ""')
          echo "latest deployment: $state ($url)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Probe production health
        id: health
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            "https://link.mzg.my.id/api/health" || echo 000)
          echo "health status: $code"
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Trigger a fresh production deployment
        if: >
          steps.inspect.outputs.state == 'ERROR' ||
          steps.inspect.outputs.state == 'CANCELED'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          body='{"name":"shortlink-website","project":"'"$VERCEL_PROJECT_ID"'","target":"production","gitSource":{"type":"github","ref":"main","repoId":1426596923}}'
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" https://api.vercel.com/v13/deployments)
          head -c 300 /tmp/deploy.json; echo
          test "$code" -ge 200 -a "$code" -lt 300
